    <style>
        .channel-wrapper {
            position: relative;

            height: 0;

            height: 100%;

        .channel-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-color);
            font-weight: 300;
            letter-spacing: 0.05em;
            border: 1px solid var(--text-color);
            border-radius: 4px;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
        }

        .channel-link:hover {
            background-color: rgba(255, 255, 255, 0.08);

    <nav class="site-nav">
